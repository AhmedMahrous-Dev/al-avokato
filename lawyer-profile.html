<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للمحامي | الأفوكاتو</title>

    <link rel="icon" type="image/png" href="IMG/6012537899385031935_121.jpg">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <section class="profile-header">
        <h1>الملف الشخصي للمحامي</h1>
        <p>تعرف على خبرات المحامي وخدماته القانونية</p>
    </section>

    <div class="container">
        <div class="profile-card">
            
            <!-- صورة وبيانات المحامي الرئيسية -->
            <div class="text-center">
                <img id="lawyerImage" class="lawyer-image" alt="صورة المحامي">
                <h2 id="lawyerName" class="mt-3 fw-bold"></h2>
                <h5 id="lawyerTitle" class="text-warning"></h5>
            </div>

            <hr class="my-4">

            <!-- تفاصيل الخبرة والموقع -->
            <div class="row g-4 mt-1">
                <div class="col-md-4">
                    <div class="info-box">
                        <h6>سنوات الخبرة</h6>
                        <h3 id="lawyerExp"></h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <h6>المحافظة</h6>
                        <h3 id="lawyerCity"></h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <h6>رقم النقابة</h6>
                        <h3 id="lawyerNumber"></h3>
                    </div>
                </div>
            </div>

            <!-- نبذة عن المحامي -->
            <div class="mt-5">
                <h3 class="fw-bold">نبذة عن المحامي</h3>
                <p id="lawyerAbout" class="lead mt-2"></p>
            </div>

            <!-- التخصصات -->
            <div class="mt-5">
                <h3 class="fw-bold">التخصصات</h3>
                <div id="skills" class="mt-2"></div>
            </div>

            <!-- الإحصائيات -->
            <div class="row g-4 mt-4">
                <div class="col-md-4">
                    <div class="info-box">
                        <h6>عدد العملاء</h6>
                        <h2 id="clients"></h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <h6>القضايا</h6>
                        <h2 id="cases"></h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <h6>نسبة النجاح</h6>
                        <h2 id="success"></h2>
                    </div>
                </div>
            </div>

            <!-- سعر الاستشارة والحجز -->
            <div class="text-center mt-5">
                <h4>
                    سعر الاستشارة: 
                    <span id="lawyerPrice" class="text-warning"></span>
                </h4>
                <a id="consultBtn" class="btn btn-gold mt-3">احجز استشارة الآن</a>
            </div>

        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
